version: 0.2

phases:
  build:
    commands:
      - echo "===== UAT DEPLOYMENT START ====="
      - |
        COMMAND_ID=$(aws ssm send-command \
          --instance-ids i-0f277b4603ddd2be1 \
          --document-name "AWS-RunShellScript" \
          --parameters 'commands=[
            "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 042775549160.dkr.ecr.ap-south-1.amazonaws.com",
            "docker pull 042775549160.dkr.ecr.ap-south-1.amazonaws.com/linux-monitoring-system:latest",
            "docker rm -f linux-monitoring-uat 2>/dev/null || true",
            "docker run -d --name linux-monitoring-uat 042775549160.dkr.ecr.ap-south-1.amazonaws.com/linux-monitoring-system:latest",
            "sleep 5",
            "docker ps --filter name=linux-monitoring-uat",
            "docker logs --tail 30 linux-monitoring-uat"
          ]' \
          --region ap-south-1 \
          --query "Command.CommandId" \
          --output text)

        echo "SSM Command ID: ${COMMAND_ID}"

        echo "Waiting for UAT deployment..."
        aws ssm wait command-executed \
          --command-id "${COMMAND_ID}" \
          --instance-id i-0f277b4603ddd2be1 \
          --region ap-south-1

        STATUS=$(aws ssm get-command-invocation \
          --command-id "${COMMAND_ID}" \
          --instance-id i-0f277b4603ddd2be1 \
          --region ap-south-1 \
          --query "Status" \
          --output text)

        echo "UAT deployment status: ${STATUS}"

        if [ "${STATUS}" != "Success" ]; then
          echo "===== UAT DEPLOYMENT FAILED ====="
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id i-0f277b4603ddd2be1 \
            --region ap-south-1 \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json
          exit 1
        fi

        echo "===== UAT DEPLOYMENT SUCCESSFUL ====="

  post_build:
    commands:
      - echo "===== UAT DEPLOYMENT COMPLETED ====="
