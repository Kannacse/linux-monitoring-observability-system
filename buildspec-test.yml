version: 0.2

phases:
  pre_build:
    commands:
      - echo "===== TEST PRE-BUILD ====="
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - IMAGE="${ECR_REGISTRY}/${ECR_REPO}:latest"
      - echo "ECR_REGISTRY=${ECR_REGISTRY}"
      - echo "IMAGE=${IMAGE}"
      - aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" |
          docker login --username AWS --password-stdin "${ECR_REGISTRY}"

  build:
    commands:
      - echo "===== TEST BUILD ====="

      - echo "Pulling image..."
      - docker pull "${IMAGE}"

      - echo "Starting monitoring container..."
      - docker run -d \
          --name linux-monitoring-test \
          "${IMAGE}"

      - echo "Waiting for monitoring system..."
      - sleep 10

      - echo "Checking container status..."
      - docker inspect linux-monitoring-test \
          --format '{{.State.Status}}' | grep -q "running"

      - echo "Checking monitoring output..."
      - docker logs linux-monitoring-test

      - echo "Checking monitoring process..."
      - docker exec linux-monitoring-test test -x /app/controller/main-monitor

      - echo "Checking project scripts..."
      - docker exec linux-monitoring-test test -x /app/start-project.sh

      - echo "===== MONITORING TEST PASSED ====="

  post_build:
    commands:
      - echo "===== TEST CLEANUP ====="
      - docker rm -f linux-monitoring-test || true
      - echo "===== TEST COMPLETED ====="
