version: 0.2

# AWS CodeBuild configuration for:
# linux-monitoring-observability-system
#
# This is the AWS equivalent of the Docker/ECR/EC2 deployment
# stages currently implemented in jenkins/Jenkinsfile.
#
# CodeBuild environment variables to configure in the AWS Console:
#   ECR_REPO=linux-monitoring-system
#   IMAGE_NAME=linux-monitor-system
#   INSTANCE_ID=<your EC2 instance ID>
#
# AWS_DEFAULT_REGION is supplied by CodeBuild/AWS.

phases:

  install:
    commands:
      - echo "===== INSTALL PHASE ====="
      - echo "CodeBuild started"
      - aws --version
      - docker --version
      - git --version

  pre_build:
    commands:
      - echo "===== PRE-BUILD PHASE ====="
      - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - export ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - export REPOSITORY_URI="${ECR_REGISTRY}/${ECR_REPO}"
      - export IMAGE_TAG=$(echo "${CODEBUILD_RESOLVED_SOURCE_VERSION}" | cut -c 1-7)
      - echo "AWS Account: ${AWS_ACCOUNT_ID}"
      - echo "AWS Region: ${AWS_DEFAULT_REGION}"
      - echo "ECR Repository: ${REPOSITORY_URI}"
      - echo "Image Tag: ${IMAGE_TAG}"
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

  build:
    commands:
      - echo "===== BUILD PHASE ====="
      - echo "Building Docker image..."
      - docker build -t "${IMAGE_NAME}:${IMAGE_TAG}" -f docker/Dockerfile .
      - echo "Tagging image for ECR..."
      - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - export ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - export REPOSITORY_URI="${ECR_REGISTRY}/${ECR_REPO}"
      - export IMAGE_TAG=$(echo "${CODEBUILD_RESOLVED_SOURCE_VERSION}" | cut -c 1-7)
      - docker tag "${IMAGE_NAME}:${IMAGE_TAG}" "${REPOSITORY_URI}:${IMAGE_TAG}"
      - docker tag "${IMAGE_NAME}:${IMAGE_TAG}" "${REPOSITORY_URI}:latest"

  post_build:
    commands:
      - echo "===== POST-BUILD PHASE ====="
      - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - export ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - export REPOSITORY_URI="${ECR_REGISTRY}/${ECR_REPO}"
      - export IMAGE_TAG=$(echo "${CODEBUILD_RESOLVED_SOURCE_VERSION}" | cut -c 1-7)
      - echo "Pushing versioned image..."
      - docker push "${REPOSITORY_URI}:${IMAGE_TAG}"
      - echo "Pushing latest image..."
      - docker push "${REPOSITORY_URI}:latest"
      - echo "Creating SSM deployment command file..."
      - |
        cat > /tmp/ssm-commands.json <<EOF
        {
          "commands": [
            "aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}",
            "docker pull ${REPOSITORY_URI}:${IMAGE_TAG}",
            "docker stop linux-monitoring || true",
            "docker rm linux-monitoring || true",
            "docker run -d --name linux-monitoring --restart unless-stopped -p 8080:8080 ${REPOSITORY_URI}:${IMAGE_TAG}"
          ]
        }
        EOF
      - echo "Sending deployment command to EC2 through AWS Systems Manager..."
      - |
        COMMAND_ID=$(aws ssm send-command \
          --region "${AWS_DEFAULT_REGION}" \
          --instance-ids "${INSTANCE_ID}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy linux-monitoring ${IMAGE_TAG}" \
          --parameters file:///tmp/ssm-commands.json \
          --query "Command.CommandId" \
          --output text)
        echo "SSM Command ID: ${COMMAND_ID}"
        printf "%s" "${COMMAND_ID}" > /tmp/ssm-command-id.txt
      - |
        COMMAND_ID=$(cat /tmp/ssm-command-id.txt)
        echo "Waiting for SSM command to complete..."
        aws ssm wait command-executed \
          --region "${AWS_DEFAULT_REGION}" \
          --command-id "${COMMAND_ID}" \
          --instance-id "${INSTANCE_ID}"
      - |
        COMMAND_ID=$(cat /tmp/ssm-command-id.txt)
        echo "===== SSM DEPLOYMENT RESULT ====="
        aws ssm get-command-invocation \
          --region "${AWS_DEFAULT_REGION}" \
          --command-id "${COMMAND_ID}" \
          --instance-id "${INSTANCE_ID}" \
          --query '{Status:Status,ResponseCode:ResponseCode,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}' \
          --output json
      - echo "===== DEPLOYMENT COMPLETE ====="

artifacts:
  files:
    - '**/*'
  discard-paths: no
